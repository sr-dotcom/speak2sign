name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - uses: actions/cache@v4
        with:
          path: models/faster-whisper-base.en
          key: faster-whisper-base.en-v1
      - run: pytest -q
      - name: Memory budget (lexicon + whisper + one transcription, 1800 MB)
        run: python scripts/measure_rss.py 1800
