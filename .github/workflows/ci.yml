name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - uses: actions/cache@v4
        with:
          path: |
            models/faster-whisper-base.en
            models/t5_gloss_ct2
          key: models-whisper-base.en-t5-v0.5.0
      - run: pytest -q
      - name: Memory budget (lexicon + whisper + T5 + one transcription, 1800 MB)
        env:
          T5_RELEASE_URL: https://github.com/sr-dotcom/speak2sign/releases/download/v0.5.0-t5/t5_gloss_ct2.zip
        run: python scripts/measure_rss.py 1800
