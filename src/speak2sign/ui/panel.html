<div class="s2s">
  <div class="s2s-controls">
    <button class="s2s-play" type="button">Play</button>
    <button class="s2s-restart" type="button">Restart</button>
    <span class="s2s-status">Ready</span>
  </div>
  <div class="s2s-stage">
    <section class="s2s-news">
      <div class="s2s-label">News</div>
      <audio class="s2s-audio" preload="auto"></audio>
      <div class="s2s-captions"></div>
      <div class="s2s-wait" hidden>Waiting for the interpreter…</div>
    </section>
    <section class="s2s-panel">
      <div class="s2s-label">ASL interpreter panel</div>
      <div class="s2s-videos">
        <video class="s2s-video" muted playsinline preload="auto"></video>
        <video class="s2s-video" muted playsinline preload="auto" hidden></video>
        <div class="s2s-textsign" hidden></div>
      </div>
      <div class="s2s-sign">
        <span class="s2s-gloss">—</span>
        <span class="s2s-badge"></span>
        <span class="s2s-note"></span>
      </div>
    </section>
  </div>
</div>
