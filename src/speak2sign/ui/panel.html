<div class="s2s" role="region" aria-label="News with ASL interpreter panel">
  <div class="s2s-controls">
    <button class="s2s-play" type="button">Play</button>
    <button class="s2s-restart" type="button">Restart</button>
    <span class="s2s-status" role="status" aria-live="polite">Ready</span>
  </div>
  <div class="s2s-stage">
    <section class="s2s-news" aria-label="News">
      <div class="s2s-label" aria-hidden="true">News</div>
      <audio class="s2s-audio" preload="auto"></audio>
      <div class="s2s-captions" role="group" aria-label="Caption; struck-through words are function words not signed"></div>
      <div class="s2s-wait" role="status" aria-live="polite" hidden>Waiting for the interpreter…</div>
    </section>
    <section class="s2s-panel" aria-label="ASL interpreter panel">
      <div class="s2s-label" aria-hidden="true">ASL interpreter panel</div>
      <div class="s2s-videos">
        <video class="s2s-video" muted playsinline preload="auto" tabindex="-1" aria-label="Recorded ASL sign clip, silent; the sign is named below"></video>
        <video class="s2s-video" muted playsinline preload="auto" tabindex="-1" aria-label="Recorded ASL sign clip, silent; the sign is named below" hidden></video>
        <div class="s2s-textsign" role="img" hidden></div>
      </div>
      <div class="s2s-sign" aria-live="polite" aria-atomic="true">
        <span class="s2s-gloss">—</span>
        <span class="s2s-badge"></span>
        <span class="s2s-note"></span>
      </div>
    </section>
  </div>
</div>
